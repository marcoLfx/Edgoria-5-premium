<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow,noarchive"/><meta name="referrer" content="no-referrer"/>
<meta name="theme-color" content="#071323"/><title>Recuperar contraseña | EDGORIA</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#07111f;color:#f5f8ff}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#122c51,transparent 55%),#07111f}
main{width:min(100%,470px);padding:clamp(24px,5vw,44px);border-radius:24px;border:1px solid #305074;background:#101f34;box-shadow:0 25px 80px #0008}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:35px}.brand img{width:42px;height:42px}.brand strong{font-size:23px;letter-spacing:.19em}.brand small{display:block;font-size:10px;color:#84aacf;letter-spacing:.2em}
h1{font-size:clamp(25px,5vw,34px);line-height:1.12;margin:0 0 16px}p{color:#a9c3e3;line-height:1.6;font-size:14px}label{display:block;margin:18px 0;font-size:14px;font-weight:600}input{width:100%;margin-top:9px;background:#0b1729;border:1px solid #315175;color:white;font-size:16px;padding:15px 16px;border-radius:12px}input:focus{outline:2px solid #55dfee;outline-offset:2px}.btn{display:inline-block;text-decoration:none;background:linear-gradient(110deg,#58eddb,#77a9ff);border:0;color:#081627;border-radius:11px;font-weight:700;padding:14px 18px;cursor:pointer}button.btn{width:100%;font-size:15px}button[disabled]{opacity:.6;cursor:progress}.other{display:block;margin-top:22px;color:#82cce9;text-decoration:none;font-size:13px}#status{min-height:22px;margin-top:20px;font-size:14px;color:#9fe7d9}#status.error{color:#ffadb3}#form[hidden]{display:none}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><script type="module" src="/reset-password.js?v=5.10.0"></script></head>
<body><main><div class="brand"><img src="/favicon.svg" alt=""/><div><strong>EDGORIA</strong><small>TRADING INTELLIGENCE</small></div></div>
<h1>Establece tu nueva contraseña</h1><p>Estamos verificando el enlace de recuperación. Después podrás elegir una contraseña nueva para ingresar.</p>
<form id="form" hidden><label>Nueva contraseña<input type="password" name="password" autocomplete="new-password" minlength="10" required placeholder="Mínimo 10 caracteres"/></label><label>Confirmar contraseña<input type="password" name="confirm" autocomplete="new-password" minlength="10" required placeholder="Repite la contraseña"/></label><button type="submit" class="btn">Guardar nueva contraseña</button></form>
<div id="status" role="status" aria-live="polite">Verificando tu enlace…</div><a class="other" href="/app">← Volver al inicio de sesión</a></main></body></html>
